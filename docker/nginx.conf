server {
  listen 5173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # `absolute_redirect off;` — achado real, 2026-09-03: esse container
  # escuta numa porta INTERNA (5173, atrás do Traefik/Dokploy, que
  # termina TLS no domínio real em 443). Qualquer redirect que o nginx
  # gere sozinho (ex.: o de diretório-sem-barra-final abaixo) por padrão
  # monta um `Location` ABSOLUTO usando host+porta de escuta do próprio
  # nginx (`$server_port`, aqui 5173) — vazando essa porta interna, não
  # roteável publicamente, pro navegador do usuário (visto em produção:
  # redirect pra `dominio.com:5173`, conexão trava — a porta não é
  # exposta fora da rede do container). `off` faz o nginx emitir só o
  # PATH (`Location: /rota/`), o navegador resolve contra o host:porta
  # que ele já está usando de verdade (o domínio público, via Traefik).
  absolute_redirect off;

  location / {
    # Sem `$uri/` de propósito — bug real, 2026-09-03: um asset estático
    # em `public/<nome>/...` (`dist/<nome>/` depois do build) com o MESMO
    # nome de uma rota SPA (`/<nome>`) faz o `$uri/` bater como diretório
    # existente ANTES do fallback pro `index.html`, disparando o redirect
    # de barra final do próprio nginx (nunca chega no Vue Router). Sem
    # `$uri/`, só um arquivo de verdade (`$uri`) intercepta o fallback —
    # os assets em `public/` continuam servidos normalmente (são
    # arquivos, não diretórios), e qualquer rota da SPA, mesmo colidindo
    # de nome com uma pasta estática, sempre cai em `/index.html`.
    try_files $uri /index.html;
  }

  location /assets {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}